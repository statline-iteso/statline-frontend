# Weekly dependency updates as PRs into develop (reviewed like any other PR; auto-merge.yml
# does not touch them). Minor and patch updates are grouped to keep the PR count low; majors
# come one by one. Docker majors are ignored: a Node or nginx major is a decision, not a bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
