name: CD

# Proposal §4.3, step 2 for the web image: on develop, main and vX.Y.Z tags, build statline/web,
# scan it with Trivy (fail on HIGH/CRITICAL), push it to Docker Hub only if clean and ask statline-infra
# to bump web.image.tag of the matching environment. develop → staging; main and tags → prod.
# main and tags promote the image develop already built and staging ran (D-44); only a commit
# with no such image is built. Pushed images carry SBOM and provenance attestations.
# Nothing deploys from here: Argo CD syncs statline-infra.

on:
  push:
    branches: [develop, main]
    tags: ["v*.*.*"]
  # auto-merge.yml starts CD on develop after each merge (merges made with GITHUB_TOKEN fire no push).
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Docker Hub namespace of the images: repository variable DOCKERHUB_NAMESPACE (the account that
# owns the repos), "statline" when unset. A variable, not a secret: secret values are masked in
# logs and job outputs, which would break the image names.
env:
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'statline' }}

jobs:
  gate:
    name: secrets present?
    runs-on: ubuntu-latest
    outputs:
      dockerhub: ${{ steps.check.outputs.dockerhub }}
      dispatch: ${{ steps.check.outputs.dispatch }}
    steps:
      - id: check
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          echo "dockerhub=$([ -n "$DOCKERHUB_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "dispatch=$([ -n "$INFRA_DISPATCH_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -n "$DOCKERHUB_TOKEN" ] || echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set; nothing is built or pushed."
          [ -n "$INFRA_DISPATCH_TOKEN" ] || echo "::notice::INFRA_DISPATCH_TOKEN not set; statline-infra is not notified."

  image:
    name: image · web
    needs: gate
    if: needs.gate.outputs.dockerhub == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2 # this commit and its parents: a release merge promotes its second parent
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags (7-char SHA; vX.Y.Z on release tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/web
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=tag

      # Build once, promote: a release merge into main (and its vX.Y.Z tag) reuses the image that
      # develop built, scanned and ran in staging, instead of rebuilding the same code (D-44).
      # Candidates: the tagged commit itself (promoted or built on its main push), then the merge's
      # second parent (the release branch head, built on develop). Otherwise this run builds.
      - name: Image to promote (main and tags only)
        id: promote
        env:
          REF: ${{ github.ref }}
          IMAGE: ${{ env.IMAGE_NAMESPACE }}/web
        run: |
          set -euo pipefail
          source=""
          if [[ "$REF" == refs/heads/main || "$REF" == refs/tags/* ]]; then
            candidates=()
            if [[ "$REF" == refs/tags/* ]]; then
              head=$(git rev-parse HEAD); candidates+=("${head::7}")
            fi
            if parent=$(git rev-parse -q --verify 'HEAD^2'); then candidates+=("${parent::7}"); fi
            for c in "${candidates[@]}"; do
              if docker buildx imagetools inspect "$IMAGE:$c" >/dev/null 2>&1; then source="$c"; break; fi
            done
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          if [[ -n "$source" ]]; then
            echo "::notice::Promoting $IMAGE:$source (built, scanned and deployed to staging) instead of rebuilding."
          else
            echo "Nothing to promote; building this commit."
          fi

      - name: Trivy on the promoted image (today's vulnerability data, fail on HIGH/CRITICAL)
        if: steps.promote.outputs.source != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/web:${{ steps.promote.outputs.source }}
          version: v0.76.1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Promote (adds this ref's tags to the same image index; attestations included)
        if: steps.promote.outputs.source != ''
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ env.IMAGE_NAMESPACE }}/web:${{ steps.promote.outputs.source }}
        run: |
          set -euo pipefail
          args=()
          while read -r t; do [[ -n "$t" ]] && args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"

      - name: Build (linux/amd64, multi-stage, loaded locally; nothing is pushed yet)
        if: steps.promote.outputs.source == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT || 'statline-web' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Short SHA for the Trivy image reference
        if: steps.promote.outputs.source == ''
        id: sha
        env:
          SHA: ${{ github.sha }}
        run: echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Trivy on the local image (fail on HIGH/CRITICAL, before any push)
        if: steps.promote.outputs.source == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAMESPACE }}/web:${{ steps.sha.outputs.short }}
          version: v0.76.1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Push (only reached when the scan passed; layers come from the build cache)
        if: steps.promote.outputs.source == ''
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT || 'statline-web' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

  dispatch:
    name: tell statline-infra which tag to deploy
    needs: [gate, image]
    if: needs.gate.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Environment and tag for this ref
        id: plan
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/*) [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || { echo "::error::Tag '$REF_NAME' is not strict vX.Y.Z; statline-infra would reject it"; exit 1; } ;;
          esac
          case "$REF" in
            refs/heads/develop) env=staging; tag="${SHA::7}" ;;
            refs/heads/main)    env=prod;    tag="${SHA::7}" ;;
            refs/tags/v*.*.*)   env=prod;    tag="$REF_NAME" ;;
            *) echo "::error::No environment for $REF"; exit 1 ;;
          esac
          echo "env=$env" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: repository_dispatch bump-image
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          ENV_NAME: ${{ steps.plan.outputs.env }}
          TAG: ${{ steps.plan.outputs.tag }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg env "$ENV_NAME" --arg tag "$TAG" \
            --arg repo "$SOURCE_REPO" --arg sha "$SOURCE_SHA" \
            '{event_type: "bump-image",
              client_payload: {
                env: $env,
                images: {web: $tag},
                source_repo: $repo,
                sha: $sha}}' \
          | gh api --method POST repos/statline-iteso/statline-infra/dispatches --input -
          echo "Dispatched bump-image: env=$ENV_NAME tag=$TAG"
