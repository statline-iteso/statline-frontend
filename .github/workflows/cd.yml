name: CD

# Proposal §4.3, step 3 (DECISIONS D-11): after a merge, push statline/web:<short-sha> to
# Docker Hub (plus vX.Y.Z on tags). Skipped until the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets
# exist. Pending in SL-53: commit the new tag to gitops/values-<env>.yaml in statline-infra.

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}

permissions:
  contents: read

jobs:
  push:
    name: push · web
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'statline' }}
    steps:
      - name: Docker Hub secrets missing
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set; nothing pushed."
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: docker/setup-buildx-action@v3
        if: env.HAS_SECRETS == 'true'
      - uses: docker/login-action@v3
        if: env.HAS_SECRETS == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags
        id: tags
        if: env.HAS_SECRETS == 'true'
        run: |
          image="$NAMESPACE/web"
          tags="$image:$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags,$image:${GITHUB_REF_NAME}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: env.HAS_SECRETS == 'true'
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
      - name: Summary
        if: env.HAS_SECRETS == 'true'
        run: echo "Pushed \`${{ steps.tags.outputs.tags }}\`." >> "$GITHUB_STEP_SUMMARY"
